<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Calculator</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class = "display">0</div>    
    <div class = "buttons">
        <div class = "row">
            <button class = "clear">AC</button>
            <button class = "percent">%</button>
            <button class = "backspace"><i class="material-icons" style="font-size:36px">backspace</i></button>
            <button class = "operator">&divide</button>
        </div>
        <div class = "row">
            <button class = "digit">7</button>
            <button class = "digit">8</button>
            <button class = "digit">9</button>
            <button class = "operator">x</button>
        </div>
        <div class = "row">
            <button class = "digit">4</button>
            <button class = "digit">5</button>
            <button class = "digit">6</button>
            <button class = "operator">-</button>
        </div>
        <div class = "row">
            <button class = "digit">1</button>
            <button class = "digit">2</button>
            <button class = "digit">3</button>
            <button class = "operator">+</button>
        </div>
        <div class = "row">
            <button class = "plusminus">+/-</button>
            <button class = "digit">0</button>
            <button class = "decimal">.</button>
            <button class = "equals">=</button>
        </div>

    </div>
    <script src="./script.js"></script>
</body>
</html>
